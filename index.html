<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karnataka 3D Flag Animation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="scene">

        <div class="stars"></div>

        <div class="pole">
            <div class="pole-top"></div>
        </div>

        <div class="flag-container">
            <div class="flag" id="flag">
                <div class="yellow"></div>
                <div class="red"></div>
                <div class="flag-text">ಜೈ ಕರ್ನಾಟಕ</div>
            </div>
        </div>

        <div class="title">
            <h1>ಜೈ ಕರ್ನಾಟಕ</h1>
            <p>ONE STATE • ONE PRIDE</p>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
